<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#17110d">
<title>경마브레인 · RaceBrain</title>
<style>
/* =========================================================
   경마브레인 (RaceBrain)
   컨셉: 블랙 & 브라운 · 친근한 분석 써포터 포니
   ========================================================= */

:root {
  /* 브라운 팔레트 */
  --ink:        #120e0b;   /* 최심층 배경 */
  --bg:         #17110d;   /* 앱 배경 */
  --surface:    #221913;   /* 카드 */
  --surface-2:  #2c211a;   /* 카드 강조 */
  --surface-3:  #372a20;   /* 인풋/토글 트랙 */
  --line:       #3d2e22;   /* 보더 */

  /* 텍스트 */
  --text:       #f4e9dc;
  --text-2:     #c3b2a0;
  --muted:      #8b7867;

  /* 액센트 (카라멜/앰버) */
  --amber:      #e6ac5c;
  --amber-2:    #f0c079;
  --caramel:    #c8853f;
  --brown:      #6d4d33;

  /* 상태 */
  --up:         #86c58a;   /* 이익/승 */
  --down:       #e08a72;   /* 손실 */

  --radius:     20px;
  --radius-sm:  14px;
  --shadow:     0 10px 30px rgba(0,0,0,.45);
  --grad-amber: linear-gradient(135deg, #f0c079 0%, #d9954a 55%, #c37b34 100%);
  --grad-brown: linear-gradient(160deg, #2e221a 0%, #211812 100%);

  --safe-w:     440px;
  --font: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background:
    radial-gradient(1200px 700px at 50% -10%, #241a13 0%, transparent 60%),
    var(--ink);
  display: flex;
  justify-content: center;
  min-height: 100dvh;
  letter-spacing: -.01em;
}

/* ------- 폰 프레임 ------- */
#app {
  width: 100%;
  max-width: var(--safe-w);
  min-height: 100dvh;
  background: var(--bg);
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: var(--shadow);
}
@media (min-width: 480px) {
  body { padding: 24px 0; align-items: center; }
  #app { min-height: min(920px, calc(100dvh - 48px)); border-radius: 34px; border: 1px solid var(--line); }
}

/* ------- 상단바 ------- */
.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 18px 10px;
  position: sticky; top: 0; z-index: 20;
  background: linear-gradient(var(--bg) 72%, transparent);
}
.topbar .ib { color: var(--text); }
.topbar h1 { font-size: 17px; font-weight: 800; margin: 0; letter-spacing: -.02em; }
.topbar .sub { font-size: 12px; color: var(--muted); font-weight: 600; }

.iconbtn {
  width: 38px; height: 38px; border-radius: 12px;
  display: grid; place-items: center;
  background: var(--surface); border: 1px solid var(--line);
  color: var(--text); cursor: pointer; flex: none;
}
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn:active { transform: scale(.94); }

/* ------- 스크롤 영역 ------- */
.screen {
  flex: 1; overflow-y: auto; padding: 4px 18px 120px;
  animation: fade .32s ease both;
}
.screen.no-nav { padding-bottom: 32px; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } }

/* ------- 하단 탭바 ------- */
.tabbar {
  position: absolute; left: 0; right: 0; bottom: 0;
  display: flex; padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
  background: linear-gradient(transparent, var(--ink) 40%);
  backdrop-filter: blur(8px);
}
.tabbar button {
  flex: 1; background: none; border: 0; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  color: var(--muted); font-size: 11px; font-weight: 700; padding: 6px 0;
}
.tabbar button svg { width: 23px; height: 23px; }
.tabbar button.active { color: var(--amber); }
.tabbar button:active { transform: scale(.92); }

/* ------- 공통 컴포넌트 ------- */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 18px;
}
.card--glow { background: var(--grad-brown); }
.section-t { font-size: 13px; font-weight: 800; color: var(--text-2); margin: 22px 4px 10px; letter-spacing: .02em; }
.section-t svg { width: 15px; height: 15px; vertical-align: -3px; margin-right: 3px; color: var(--amber); }
.muted { color: var(--muted); }
.row { display: flex; align-items: center; }
.between { justify-content: space-between; }
.gap8 { gap: 8px; } .gap12 { gap: 12px; }

.btn {
  width: 100%; border: 0; border-radius: 16px; cursor: pointer;
  padding: 16px; font-size: 16px; font-weight: 800; font-family: inherit;
  color: #2a1a0c; background: var(--grad-amber);
  box-shadow: 0 8px 22px rgba(201,133,63,.32);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .12s;
}
.btn svg { width: 20px; height: 20px; }
.btn:active { transform: translateY(1px) scale(.99); }
.btn:disabled { opacity: .45; box-shadow: none; cursor: not-allowed; }
.btn--ghost {
  background: var(--surface); color: var(--text);
  border: 1px solid var(--line); box-shadow: none;
}
.btn--sm { padding: 11px; font-size: 14px; border-radius: 13px; width: auto; }

/* 세그먼트 토글 */
.seg {
  display: flex; background: var(--surface-3); border: 1px solid var(--line);
  border-radius: 14px; padding: 4px; gap: 4px;
}
.seg button {
  flex: 1; border: 0; background: none; cursor: pointer;
  padding: 9px 10px; border-radius: 10px; font-family: inherit;
  font-size: 13px; font-weight: 700; color: var(--text-2);
}
.seg button.active { background: var(--surface); color: var(--amber-2); box-shadow: 0 2px 8px rgba(0,0,0,.3); }
.seg--pill button.active { background: var(--grad-amber); color: #2a1a0c; }

/* 입력 */
.field { position: relative; }
.field label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin: 0 4px 7px; }
input.inp, select.inp {
  width: 100%; font-family: inherit; font-size: 16px; color: var(--text);
  background: var(--surface-3); border: 1px solid var(--line);
  border-radius: 14px; padding: 15px 16px; outline: none;
}
input.inp:focus, select.inp:focus { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(230,172,92,.15); }
input.inp::placeholder { color: var(--muted); }
select.inp { appearance: none; background-image: none; }

.chip {
  padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 700;
  background: var(--surface-3); border: 1px solid var(--line); color: var(--text-2);
  cursor: pointer; white-space: nowrap;
}
.chip.active { background: var(--grad-amber); color: #2a1a0c; border-color: transparent; }
.chip-wrap { display: flex; flex-wrap: wrap; gap: 8px; }

.badge {
  font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px;
  background: rgba(230,172,92,.14); color: var(--amber-2);
}
.badge--mock { background: rgba(139,120,103,.2); color: var(--text-2); }

/* ------- 온보딩 ------- */
.onb {
  min-height: 100dvh; display: flex; flex-direction: column;
  justify-content: center; padding: 32px 26px 40px; text-align: center;
  animation: fade .4s ease both;
}
.onb .mascot { margin: 0 auto 6px; filter: drop-shadow(0 12px 24px rgba(0,0,0,.5)); }
.onb .float { animation: bob 3.2s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-9px); } }
.brandline { display:flex; align-items:center; justify-content:center; gap:8px; color: var(--amber); font-weight:800; letter-spacing:.06em; font-size:13px; }
.brandline svg { width:18px; height:18px; }
.onb h1 { font-size: 27px; font-weight: 900; margin: 14px 0 6px; line-height: 1.3; }
.onb p.lead { color: var(--text-2); font-size: 15px; margin: 0 0 30px; line-height: 1.6; }
.onb .field { text-align: left; margin-bottom: 14px; }
.onb .skip { margin-top: 18px; background: none; border: 0; color: var(--muted); font-size: 14px; font-weight: 700; font-family: inherit; cursor: pointer; }

/* 말풍선 */
.speech {
  position: relative; background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 16px; padding: 13px 15px; font-size: 14px; line-height: 1.55; color: var(--text);
}
.speech::before {
  content: ''; position: absolute; left: 28px; top: -9px;
  border: 9px solid transparent; border-bottom-color: var(--surface-2); border-top: 0;
}
.speech b { color: var(--amber-2); }
.pony-line { display: flex; align-items: flex-end; gap: 10px; margin: 4px 0 4px; }
.pony-line .pony { flex: none; filter: drop-shadow(0 6px 12px rgba(0,0,0,.4)); }
.pony-line .speech { flex: 1; }

/* ------- 통계 카드 ------- */
.hero {
  background: var(--grad-brown); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 18px; overflow: hidden; position: relative;
}
.hero .glowline { position:absolute; inset:0; background: var(--grad-amber); opacity:.06; }
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 4px; }
.stat {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: 15px 15px 14px;
}
.stat .k { font-size: 12px; color: var(--muted); font-weight: 700; }
.stat .v { font-size: 22px; font-weight: 900; margin-top: 6px; letter-spacing: -.02em; }
.stat .v small { font-size: 13px; font-weight: 800; color: var(--text-2); }
.stat .delta { font-size: 12px; font-weight: 800; margin-top: 4px; }
.stat.big { grid-column: 1 / -1; }
.up { color: var(--up); } .down { color: var(--down); }

.gauge {
  height: 10px; border-radius: 999px; background: var(--surface-3); overflow: hidden; margin-top: 10px;
}
.gauge > i { display: block; height: 100%; background: var(--grad-amber); border-radius: 999px; }

.streak { display: flex; gap: 5px; margin-top: 8px; }
.streak span {
  width: 22px; height: 22px; border-radius: 7px; font-size: 11px; font-weight: 800;
  display: grid; place-items: center; background: var(--surface-3); color: var(--muted);
}
.streak span.w { background: rgba(134,197,138,.18); color: var(--up); }

/* ------- 스텝 인디케이터 ------- */
.steps { display: flex; align-items: center; gap: 6px; padding: 2px 2px 14px; }
.steps .dot { flex: 1; height: 5px; border-radius: 999px; background: var(--surface-3); }
.steps .dot.on { background: var(--grad-amber); }
.steps .lbl { font-size: 12px; font-weight: 800; color: var(--amber-2); margin-left: 4px; white-space: nowrap; }

/* ------- 업로드 드롭존 ------- */
.drop {
  border: 1.6px dashed var(--line); border-radius: var(--radius);
  background: var(--surface); padding: 30px 20px; text-align: center; cursor: pointer;
  transition: border-color .2s, background .2s;
}
.drop:hover, .drop.drag { border-color: var(--amber); background: var(--surface-2); }
.drop .ic { width: 54px; height: 54px; border-radius: 16px; background: var(--surface-3); display: grid; place-items: center; margin: 0 auto 12px; color: var(--amber); }
.drop .ic svg { width: 26px; height: 26px; }
.drop h4 { margin: 0 0 4px; font-size: 15px; }
.drop p { margin: 0; font-size: 13px; color: var(--muted); }
.filerow {
  display: flex; align-items: center; gap: 12px; background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-top: 10px;
}
.filerow .ic { width: 40px; height: 40px; border-radius: 11px; background: var(--surface-3); display: grid; place-items: center; color: var(--amber); flex: none; }
.filerow .ic svg { width: 20px; height: 20px; }
.filerow .nm { font-size: 14px; font-weight: 700; }
.filerow .sz { font-size: 12px; color: var(--muted); }
.filerow .x { margin-left: auto; color: var(--muted); background: none; border: 0; font-size: 20px; cursor: pointer; }

/* ------- 출주표 / 예측 리스트 ------- */
.horse {
  display: flex; align-items: center; gap: 12px; padding: 13px 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 9px;
}
.horse .no {
  width: 34px; height: 34px; border-radius: 10px; flex: none;
  display: grid; place-items: center; font-weight: 900; font-size: 15px;
  background: var(--surface-3); color: var(--text);
}
.horse .no.r1 { background: var(--grad-amber); color: #2a1a0c; }
.horse .no.r2 { background: #b9b0a3; color: #2a1a0c; }
.horse .no.r3 { background: #c08a5a; color: #2a1a0c; }
.horse .info { flex: 1; min-width: 0; }
.horse .nm { font-size: 15px; font-weight: 800; }
.horse .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.horse .right { text-align: right; flex: none; }
.horse .odds { font-size: 15px; font-weight: 900; color: var(--amber-2); }
.horse .conf { font-size: 11px; color: var(--muted); font-weight: 700; }
.recent { display: inline-flex; gap: 3px; margin-top: 3px; }
.recent i { font-style: normal; font-size: 10px; font-weight: 800; width: 16px; height: 16px; border-radius: 5px; display: grid; place-items: center; background: var(--surface-3); color: var(--text-2); }
.recent i.win { background: rgba(230,172,92,.2); color: var(--amber-2); }

.pick {
  border-color: rgba(230,172,92,.4); background: var(--surface-2);
  box-shadow: inset 0 0 0 1px rgba(230,172,92,.15);
}

/* 분석 중 로딩 */
.analyzing { text-align: center; padding: 40px 10px; }
.analyzing .pony { animation: think 1.6s ease-in-out infinite; }
@keyframes think { 50% { transform: translateY(-6px) rotate(-3deg); } }
.dots { display:inline-flex; gap:5px; margin-top:14px; }
.dots i { width:8px; height:8px; border-radius:50%; background: var(--amber); animation: blink 1s infinite; }
.dots i:nth-child(2){ animation-delay:.2s } .dots i:nth-child(3){ animation-delay:.4s }
@keyframes blink { 0%,100%{opacity:.25; transform:scale(.8)} 50%{opacity:1; transform:scale(1)} }

/* 결과 요약 배너 */
.result-banner {
  background: var(--grad-amber); color: #2a1a0c; border-radius: var(--radius);
  padding: 20px; text-align: center; margin-bottom: 4px;
}
.result-banner .big { font-size: 30px; font-weight: 900; }
.result-banner .lbl { font-size: 13px; font-weight: 800; opacity: .8; }

/* 배팅 요약 */
.kv { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.kv:last-child { border-bottom: 0; }
.kv .k { color: var(--muted); font-weight: 700; }
.kv .v { font-weight: 800; }
.total-row { font-size: 18px; }
.total-row .v { color: var(--amber-2); }

.numpad-input { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.numpad-input .chip { flex: 1; text-align:center; }

.divider { height:1px; background: var(--line); margin: 18px 0; }
.toast {
  position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
  background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
  padding: 12px 18px; border-radius: 14px; font-size: 14px; font-weight: 700;
  box-shadow: var(--shadow); z-index: 60; animation: pop .3s ease;
}
@keyframes pop { from { opacity:0; transform: translate(-50%, 8px);} }

/* ------- 로고 (상단바) ------- */
.logo { display: flex; align-items: center; gap: 9px; }
.logo-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--grad-amber);
  display: grid; place-items: center; color: #2a1a0c; box-shadow: 0 4px 12px rgba(201,133,63,.35); }
.logo-mark svg { width: 18px; height: 18px; }
.logo-txt { font-size: 21px; font-weight: 900; letter-spacing: -.02em;
  background: var(--grad-amber); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* ------- 실전/모의 탭 ------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 2px 2px 16px; }
.tab { flex: 1; background: none; border: 0; cursor: pointer; font-family: inherit;
  font-size: 15px; font-weight: 800; color: var(--muted); padding: 10px 0 13px; position: relative; }
.tab.active { color: var(--amber-2); }
.tab.active::after { content: ''; position: absolute; left: 12%; right: 12%; bottom: -1px;
  height: 3px; border-radius: 3px; background: var(--grad-amber); }
.tab:active { transform: scale(.97); }

/* ------- 회·경주 카운트 ------- */
.cnt { display: flex; align-items: baseline; gap: 5px; }
.cnt b { font-size: 26px; font-weight: 900; letter-spacing: -.02em; }
.cnt .u { font-size: 14px; color: var(--text-2); font-weight: 800; }
.cnt .dot { color: var(--muted); margin: 0 3px; }

/* ------- 최신 날짜 선택 ------- */
.date-row { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; -webkit-overflow-scrolling: touch; }
.date-row::-webkit-scrollbar { display: none; }
.date-chip { flex: none; display: flex; align-items: center; gap: 4px; padding: 8px 13px;
  border-radius: 12px; background: var(--surface-3); border: 1px solid var(--line);
  color: var(--text-2); font-size: 13px; font-weight: 700; cursor: pointer; }
.date-chip.active { background: var(--grad-amber); color: #2a1a0c; border-color: transparent; }
.date-chip .pin { font-size: 10px; }
.pinbtn { display: inline-flex; align-items: center; gap: 5px; background: var(--surface-3);
  border: 1px solid var(--line); color: var(--text-2); border-radius: 10px; padding: 7px 12px;
  font-size: 12px; font-weight: 800; font-family: inherit; cursor: pointer; margin-bottom: 6px; }
.pinbtn.on { background: rgba(230,172,92,.16); color: var(--amber-2); border-color: rgba(230,172,92,.4); }

/* ------- 회수율 다이버징 게이지 ------- */
.roi-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
.roi-scale .mid { color: var(--amber-2); }
.roi-track { position: relative; height: 16px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.roi-fill { position: absolute; top: 0; bottom: 0; }
.roi-fill.up { background: linear-gradient(90deg, #e6ac5c, #86c58a); }
.roi-fill.down { background: linear-gradient(90deg, #e08a72, #c8853f); }
.roi-zero { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 2px; background: var(--amber-2); transform: translateX(-1px); z-index: 2; }
.roi-knob { position: absolute; top: 50%; width: 15px; height: 15px; border-radius: 50%;
  background: #fff; border: 2px solid #2a1a0c; transform: translate(-50%, -50%); z-index: 3; }
.roi-val { text-align: center; font-size: 19px; font-weight: 900; margin-top: 9px; }

/* ------- 적중률 행 ------- */
.hit-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.hit-name { width: 48px; font-size: 14px; font-weight: 800; flex: none; }
.hit-bar { flex: 1; height: 9px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.hit-bar > i { display: block; height: 100%; background: var(--grad-amber); border-radius: 999px; }
.hit-val { flex: none; font-size: 13px; font-weight: 800; min-width: 92px; text-align: right; }
.hit-val small { color: var(--muted); font-weight: 700; }
.hit-val.none { color: var(--muted); }
.expand-btn { width: 100%; background: none; border: 1px dashed var(--line); color: var(--text-2);
  border-radius: 12px; padding: 10px; font-size: 13px; font-weight: 800; font-family: inherit; cursor: pointer; margin-top: 8px; }
.expand-btn:active { transform: scale(.99); }

/* ------- 전문가 순위 (분석 결과) ------- */
.expert-row { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; }
.expert-row::-webkit-scrollbar { display: none; }
.expert-chip { flex: none; display: flex; align-items: center; gap: 7px; padding: 8px 12px 8px 8px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-size: 13px; font-weight: 700; }
.expert-chip .er { width: 22px; height: 22px; border-radius: 7px; background: var(--surface-3);
  color: var(--amber-2); font-weight: 900; font-size: 12px; display: grid; place-items: center; }
.exp { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 999px; margin-left: 6px;
  background: rgba(230,172,92,.15); color: var(--amber-2); vertical-align: 1px; }
.exp--none { background: var(--surface-3); color: var(--muted); }

/* ------- 배팅 페이저/에디터 ------- */
.bet-pager { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.pgbtn { width: 40px; height: 40px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line);
  color: var(--text); display: grid; place-items: center; cursor: pointer; flex: none; }
.pgbtn svg { width: 20px; height: 20px; }
.pgbtn:disabled { opacity: .35; cursor: default; }
.pg-ind { flex: 1; text-align: center; font-weight: 800; font-size: 14px; color: var(--amber-2); }
.bet-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.mini-t { font-size: 13px; font-weight: 800; color: var(--text-2); margin: 0 2px 9px; }
.bet-actions { display: flex; gap: 10px; margin-top: 12px; }
.bet-actions .btn { justify-content: center; }
.bet-actions svg { width: 16px; height: 16px; }

/* ------- 마권 사진 그리드 ------- */
.slip-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.slip { position: relative; aspect-ratio: 1; border-radius: 12px; background: var(--surface-2);
  border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; color: var(--amber); font-size: 12px; font-weight: 800; }
.slip-ic svg { width: 20px; height: 20px; }
.slip .rm { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--down); color: #2a1a0c; border: 2px solid var(--bg); font-size: 13px; font-weight: 900; cursor: pointer; line-height: 1; }
.slip.add { background: none; border: 1.6px dashed var(--line); color: var(--text-2); cursor: pointer; }
.slip.add svg { width: 18px; height: 18px; }

/* ------- 결과 착순(포디움) ------- */
.podium { display: flex; gap: 10px; }
.pod { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 12px 8px; text-align: center; }
.pod .no { width: 34px; height: 34px; margin: 0 auto; }
.pod .pl { font-size: 12px; font-weight: 800; color: var(--muted); margin-top: 7px; }
.pod .pn { font-size: 13px; font-weight: 700; margin-top: 2px; }
.result-banner .lbl { opacity: .85; }

/* ------- 배팅 결과 카드 ------- */
.bet-result { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 13px 15px; margin-bottom: 9px; }
.bet-result.hit { border-color: rgba(230,172,92,.45); background: var(--surface-2); }
.br-top { display: flex; justify-content: space-between; align-items: center; }
.br-type { font-size: 15px; font-weight: 800; }
.br-badge { font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 999px; }
.br-badge.hit { background: rgba(230,172,92,.18); color: var(--amber-2); }
.br-badge.miss { background: var(--surface-3); color: var(--muted); }
.br-mid { display: flex; justify-content: space-between; font-size: 13px; margin-top: 6px; }
.br-bot { display: flex; justify-content: space-between; font-size: 14px; margin-top: 6px; }

/* ------- 통계 경주 목록 ------- */
.roi-pill { font-size: 14px; font-weight: 900; padding: 5px 11px; border-radius: 999px; }
.roi-pill.up { background: rgba(134,197,138,.16); color: var(--up); }
.roi-pill.down { background: rgba(224,138,114,.16); color: var(--down); }
.race-item { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 9px; overflow: hidden; }
.race-item.open { border-color: rgba(230,172,92,.4); }
.race-head { width: 100%; background: none; border: 0; cursor: pointer; color: var(--text);
  display: flex; justify-content: space-between; align-items: center; padding: 14px 15px; font-family: inherit; text-align: left; }
.race-name { font-size: 15px; font-weight: 800; }
.race-head .chev { color: var(--muted); font-size: 11px; }
.race-detail { padding: 0 15px 14px; }
.btable { border-top: 1px solid var(--line); }
.btr { display: grid; grid-template-columns: 1.2fr 1fr 1fr 1.1fr 1.1fr; gap: 6px; padding: 9px 0;
  border-bottom: 1px solid var(--line); font-size: 12.5px; font-weight: 700; align-items: center; }
.btr span:nth-child(n+3) { text-align: right; }
.btr.bthead { color: var(--muted); font-size: 11px; font-weight: 800; }
.btr.hit { color: var(--text); }
.race-sum { display: flex; justify-content: space-between; padding-top: 11px; font-size: 14px; font-weight: 800; }

/* ------- 실제 분석 준비 안내 ------- */
.realtip { margin-top: 22px; padding: 13px 15px; border-radius: 14px; font-size: 13px; line-height: 1.5;
  background: rgba(230,172,92,.12); border: 1px solid rgba(230,172,92,.4); color: var(--amber-2); font-weight: 700; }
.realtip b { color: var(--amber-2); }

/* ------- 마번 1~12 숫자 그리드 ------- */
.num-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.numchip { aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-3);
  color: var(--text); font-size: 16px; font-weight: 800; font-family: inherit; cursor: pointer; }
.numchip.active { background: var(--grad-amber); color: #2a1a0c; border-color: transparent; }
.numchip:active { transform: scale(.94); }

/* ------- 브레인 분석 행 ------- */
.rtime { font-size: 12px; font-weight: 700; color: var(--amber-2); margin-left: 6px; }
.brank { display: flex; align-items: center; gap: 11px; padding: 9px 0; border-top: 1px solid var(--line); }
.brank.top .bnm { color: var(--text); }
.brank .no { width: 30px; height: 30px; flex: none; font-size: 14px; }
.binfo { flex: 1; min-width: 0; }
.bnm { font-size: 14px; font-weight: 800; }
.btags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.btag { font-size: 10.5px; font-weight: 800; padding: 2px 7px; border-radius: 999px; background: rgba(230,172,92,.15); color: var(--amber-2); }
.bconf { flex: none; font-size: 13px; font-weight: 900; color: var(--amber-2); }

/* ------- 배당률 입력 행 ------- */
.mult-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.mult-lbl { flex: 1; font-size: 14px; font-weight: 700; }
.mult-inp { flex: none; width: 120px; padding: 11px 12px; }

/* ------- 결과 대기 pill ------- */
.roi-pill.pend { background: rgba(230,172,92,.16); color: var(--amber-2); cursor: pointer; border: 1px solid rgba(230,172,92,.4); }

/* 인라인 아이콘 크기 보정 (카드 내 텍스트 옆 아이콘) */
.card--glow .row svg { width: 18px; height: 18px; vertical-align: -3px; }

/* ------- 가로 밀림(오버스크롤) 방지 ------- */
html, body { overflow-x: hidden; overscroll-behavior: none; }
#app { overflow-x: hidden; max-width: 100%; }
.screen { overflow-x: hidden; overscroll-behavior-y: contain; touch-action: pan-y; }
.chip-wrap, .num-grid, .stat-grid { max-width: 100%; }

/* ------- 결과: 배팅별 배당률 입력 카드 ------- */
.mult-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 13px 14px; margin-bottom: 10px; }
.mc-top { display: flex; justify-content: space-between; align-items: center; }
.mc-type { font-size: 15px; font-weight: 800; }
.mc-no { font-size: 13px; font-weight: 700; color: var(--text-2); }
.mc-in { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.mc-lbl { font-size: 13px; font-weight: 700; color: var(--muted); flex: none; }
.mc-in .mult-inp { flex: 1; width: auto; padding: 12px 13px; }
.mc-x { font-size: 14px; font-weight: 800; color: var(--text-2); flex: none; }
.mc-get { font-size: 12.5px; font-weight: 800; margin-top: 8px; }

/* 결과입력: 적중/미적중 카드 */
.mult-card.is-hit { border-color: rgba(230,172,92,.45); background: var(--surface-2); }
.mult-card.is-miss { opacity: .7; }
.hbadge { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: rgba(230,172,92,.18); color: var(--amber-2); margin-left: 6px; }
.mc-get.miss { color: var(--down); }
/* 결과분석: 날짜(회차) 소계 */
.daysum { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 10px; font-size: 13px; }
/* 회차 삭제 버튼 */
.wipebtn { background: none; border: 0; color: var(--down); font-size: 12.5px; font-weight: 800; font-family: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.wipebtn svg { width: 15px; height: 15px; }

/* ------- 추천 적중률 ------- */
.acc-card { background: var(--grad-brown); border: 1px solid var(--line); border-radius: var(--radius); padding: 15px 16px; margin-bottom: 10px; }
.acc-h { font-size: 15px; margin-bottom: 10px; }
.acc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.acc-k { font-size: 12px; color: var(--muted); font-weight: 700; }
.acc-v { font-size: 22px; font-weight: 900; margin-top: 4px; }
.acc-v small { font-size: 13px; font-weight: 800; }
.reco-row { display: flex; align-items: center; gap: 10px; }
.reco-src { flex: none; width: 68px; font-size: 13px; font-weight: 800; }
.reco-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.rchip { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center;
  font-size: 13px; font-weight: 800; background: var(--surface-3); color: var(--text-2); border: 1px solid var(--line); }
.rchip.hit { background: var(--grad-amber); color: #2a1a0c; border-color: transparent; box-shadow: 0 0 0 2px rgba(230,172,92,.3); }
.reco-tags { font-size: 12px; font-weight: 700; color: var(--muted); margin: 6px 0 0 78px; }
.rbadge { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
.rbadge.ok { background: rgba(134,197,138,.18); color: var(--up); }
.rbadge.no { background: var(--surface-3); color: var(--muted); }

/* ------- 결과분석 개별 삭제 ------- */
.race-headrow { display: flex; align-items: stretch; }
.del-race { flex: none; width: 46px; background: none; border: 0; border-left: 1px solid var(--line);
  color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.del-race svg { width: 18px; height: 18px; }
.del-race:active { transform: scale(.9); color: var(--down); }
.race-item .race-head { border-radius: 0; }

/* ------- 고배당(복병) 칩 ------- */
.rchip.longshot { background: var(--surface); color: var(--amber-2); border: 2px solid var(--amber-2); text-decoration: underline; }

/* ------- 모달(팝업) ------- */
.modal-ov { position: absolute; inset: 0; z-index: 100; background: rgba(0,0,0,.6);
  display: flex; align-items: center; justify-content: center; padding: 20px; animation: fade .2s ease; }
.modal-card { width: 100%; max-width: 380px; max-height: 80%; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; box-shadow: var(--shadow); }
.modal-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; font-size: 16px; }
.modal-x { background: var(--surface-3); border: 0; color: var(--text); width: 30px; height: 30px; border-radius: 9px; font-size: 15px; cursor: pointer; }
.modal-close { margin-top: 16px; }
.combo-t { font-size: 13px; font-weight: 800; color: var(--amber-2); margin-bottom: 8px; }
.combo-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.combo-n { width: 20px; height: 20px; border-radius: 6px; background: var(--surface-3); color: var(--muted);
  font-size: 12px; font-weight: 800; display: grid; place-items: center; flex: none; }

</style>

const DB = {
  regions: ['서울', '부산경남', '제주'],

  // 배팅 타입
  betTypes: [
    { id: 'win',      name: '단승식',   desc: '1착 맞히기',            need: 1 },
    { id: 'place',    name: '연승식',   desc: '3착 이내',              need: 1 },
    { id: 'quinella', name: '복승식',   desc: '1·2착 조합 (순서 무관)', need: 2 },
    { id: 'exacta',   name: '쌍승식',   desc: '1·2착 순서까지',        need: 2 },
    { id: 'qplace',   name: '복연승식', desc: '지정 2두가 3착 이내',    need: 2 },
    { id: 'trio',     name: '삼복승식', desc: '1·2·3착 조합 (순서 무관)', need: 3 },
  ],

  preRaces: (typeof PRERACES !== 'undefined' ? PRERACES : []),
};

function betType(id) { return DB.betTypes.find(t => t.id === id) || DB.betTypes[0]; }

/* ---------- 저장소 (file:// 등에서 막혀도 안전) ---------- */
const store = (() => {
  let ok = true;
  try { localStorage.setItem('rb.t', '1'); localStorage.removeItem('rb.t'); }
  catch (e) { ok = false; }
  const mem = {};
  return {
    get: k => { try { return ok ? localStorage.getItem(k) : (mem[k] ?? null); } catch (e) { return mem[k] ?? null; } },
    set: (k, v) => { try { ok ? localStorage.setItem(k, v) : (mem[k] = v); } catch (e) { mem[k] = v; } },
    del: k => { try { ok ? localStorage.removeItem(k) : delete mem[k]; } catch (e) { delete mem[k]; } },
  };
})();

/* ---------- 착순 판정 (배수는 사용자가 입력) ---------- */
function evalHit(bet, result) {
  const { first, second, third } = result || {};
  const top2 = [first, second].filter(x => x != null);
  const top3 = [first, second, third].filter(x => x != null);
  const H = bet.horses;
  switch (bet.type) {
    case 'win':      return H[0] === first;
    case 'place':    return top3.includes(H[0]);
    case 'quinella': return H.length === 2 && H.every(x => top2.includes(x));
    case 'exacta':   return H[0] === first && H[1] === second;
    case 'qplace':   return H.length === 2 && H.every(x => top3.includes(x));
    case 'trio':     return H.length === 3 && H.every(x => top3.includes(x));
    default:         return false;
  }
}
// 배팅 정산: 적중 여부는 착순(경마 규칙)으로 판정, 배당률(mult)은 획득 계산에만 사용
function evalBet(bet, result) {
  const hit = evalHit(bet, result);
  const mult = (result && result.mults && +result.mults[bet.idx]) || 0;
  return { hit, mult, get: hit ? Math.round((bet.amount || 0) * mult) : 0 };
}
// 레코드 정산 요약
function recSummary(rec) {
  const bet = rec.bets.reduce((s, b) => s + (b.amount || 0), 0);
  let payout = 0, hits = 0;
  if (rec.settled) rec.bets.forEach((b, i) => {
    const e = evalBet({ ...b, idx: i }, rec.result);
    if (e.hit) { hits++; payout += e.get; }
  });
  return { bet, payout, hits, net: payout - bet, roi: bet ? Math.round(payout / bet * 100) : 0 };
}

/* ---------- 파생 계산 ---------- */
function roi(s)  { return s.bet ? Math.round((s.payout / s.bet) * 100) : 0; }
function net(s)  { return s.payout - s.bet; }
function hitRate(bt) { return bt && bt[0] ? Math.round((bt[1] / bt[0]) * 100) : null; }

// 기록 집계 (모드별, settled만) → {sessions,races,bet,payout,byType}
function recStats(mode) {
  const recs = State.records.filter(r => r.mode === mode && r.settled);
  const dates = new Set(recs.map(r => r.date));
  const byType = {};
  let bet = 0, payout = 0;
  recs.forEach(r => {
    const s = recSummary(r); bet += s.bet; payout += s.payout;
    r.bets.forEach((b, i) => {
      byType[b.type] = byType[b.type] || [0, 0];
      byType[b.type][0]++;
      if (evalBet({ ...b, idx: i }, r.result).hit) byType[b.type][1]++;
    });
  });
  return { sessions: dates.size, races: recs.length, bet, payout, byType };
}
function overallHit(byType) {
  let e = 0, h = 0;
  Object.values(byType || {}).forEach(([en, hi]) => { e += en; h += hi; });
  return { entries: e, hits: h, rate: e ? Math.round(h / e * 100) : 0 };
}
// 모드별 기록을 날짜별로 그룹 (최신 날짜 먼저)
function recDates(mode) {
  const map = {};
  State.records.filter(r => r.mode === mode).forEach(r => { (map[r.date] = map[r.date] || []).push(r); });
  return Object.keys(map).sort((a, b) => a < b ? 1 : -1).map(date => ({ date, recs: map[date] }));
}

/* ---------- 앱 상태 ---------- */
const State = {
  user: { name: store.get('rb.name') || '' },
  records: JSON.parse(store.get('rb.records') || '[]'),
  draft: null,
  resetDraft() {
    this.draft = { mode: 'real', date: todayISO(), region: '서울', raceNo: 1, bets: [], slips: [], result: null, recordId: null };
  },
  saveName(name) {
    this.user.name = name.trim();
    if (this.user.name) store.set('rb.name', this.user.name);
  },
  _saveRecords() { store.set('rb.records', JSON.stringify(this.records)); },
  addRecord(rec) {
    rec.id = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    rec.ts = Date.now();
    this.records.push(rec);
    this._saveRecords();
    return rec.id;
  },
  getRecord(id) { return this.records.find(r => r.id === id); },
  updateRecord(id, patch) {
    const r = this.getRecord(id);
    if (r) { Object.assign(r, patch); this._saveRecords(); }
  },
  deleteByDate(date) { this.records = this.records.filter(r => r.date !== date); this._saveRecords(); },
  deleteRecord(id) { this.records = this.records.filter(r => r.id !== id); this._saveRecords(); },
  // ---- JSON 백업/복원 ----
  exportJSON() {
    return JSON.stringify({ app: 'racebrain', v: 1, exportedAt: new Date().toISOString(),
      name: this.user.name || '', records: this.records }, null, 1);
  },
  importJSON(text) {
    let data;
    try { data = JSON.parse(text); } catch (e) { return { ok: false, msg: '올바른 백업 파일이 아니에요.' }; }
    const incoming = Array.isArray(data) ? data : (data && Array.isArray(data.records) ? data.records : null);
    if (!incoming) return { ok: false, msg: '백업 파일에서 기록을 찾지 못했어요.' };
    const have = new Set(this.records.map(r => r.id));
    let added = 0;
    incoming.forEach(r => {
      if (!r || typeof r !== 'object' || !r.id) return;
      if (have.has(r.id)) return;           // 기존 데이터는 절대 덮지 않음 (없는 것만 추가)
      this.records.push(r); have.add(r.id); added++;
    });
    if (added) this._saveRecords();
    if (data && data.name && !this.user.name) this.saveName(data.name);
    return { ok: true, added, total: this.records.length };
  },
};

  const oh = overallHit(s.byType);
  // 배팅타입별 적중률 (내가 배팅한 타입만)
  const rows = DB.betTypes.filter(t => s.byType[t.id]).map(t => {

      <div class="stat big"><div class="row between"><div class="k">회수율</div><div class="v" style="font-size:18px">${roi(s)}<small>%</small></div></div></div>

    const node = el(`<div class="race-item ${open?'open':''}">
      <button class="race-head" data-k="${key}">
        <div><div class="race-name">${regShort(r.region)} ${r.raceNo}R <span class="rtime">${r.start}</span> <span class="badge ${r.mode==='mock'?'badge--mock':''}">${r.mode==='mock'?'모의':'실전'}</span></div>
          <div class="muted" style="font-size:12px;margin-top:3px">${r.distance||''} · 축 ${t1.no}번 ${esc(t1.name||'')}</div></div>
        <span class="chev">${open?'▲':'▼'}</span>
      </button>
      ${open ? brainDetail(r) : ''}</div>`);
    $('[data-k]', node).onclick = () => {
      const sc = $('.screen'); const y = sc ? sc.scrollTop : 0;   // 스크롤 위치 보존
      brainOpen = open ? null : key;
      render();
      const sc2 = $('.screen'); if (sc2) sc2.scrollTop = y;
    };
    const bb = $('[data-bet]', node);
    if (bb) bb.onclick = e => {
      e.stopPropagation();
      State.resetDraft();
      Object.assign(State.draft, { region: r.region, raceNo: r.raceNo, date: r.date, mode: r.mode || 'real' });
      go('betting');
    };
    const cb = $('[data-combo]', node);
    if (cb) cb.onclick = e => { e.stopPropagation(); showCombos(r); };
    return node;
  }
  function brainDetail(r) {
    const e6 = (r.expert || []).slice(0, 6);
    const expertHtml = e6.length ? `
      <div class="section-t" style="margin:16px 2px 8px">📰 전문가 추천 <span class="muted" style="font-weight:700">· 경마지 (마지막=고배당)</span></div>
      <div class="reco-chips" style="padding:0 2px">
        ${e6.map((no, i) => `<span class="rchip ${i === e6.length-1 ? 'longshot' : ''}">${no}</span>`).join('')}</div>
      <div class="muted" style="font-size:11px;margin:8px 2px 0"><span class="rchip longshot" style="width:16px;height:16px;font-size:10px;vertical-align:-3px">●</span> 표시 = 인기 낮은 고배당 복병</div>` : '';
    return `<div class="race-detail">
      ${r.ranked.slice(0, 6).map(h => `
        <div class="brank ${h.rank<=3?'top':''}">
          <div class="no r${h.rank<=3?h.rank:''}">${h.rank<=3?h.rank:h.no}</div>
          <div class="binfo"><div class="bnm">${h.no}번 ${esc(h.name||'')}</div>
            <div class="btags">${(h.tags||[]).map(t=>`<span class="btag">${esc(t)}</span>`).join('')||'<span class="muted" style="font-size:11px">지표 상위</span>'}</div></div>
          <div class="bconf">${h.conf}%</div></div>`).join('')}
      <div class="card card--glow" style="margin-top:10px">
        ${(r.comments||[]).map(c=>`<div style="display:flex;gap:8px;padding:5px 0;font-size:13.5px;line-height:1.55"><span style="color:var(--amber)">▹</span><span>${esc(c)}</span></div>`).join('')}</div>
      ${expertHtml}
      <div class="muted" style="font-size:11px;margin:12px 0 4px;text-align:center">경마지 데이터 기반 추론 · 참고용이에요</div>
      <button class="btn btn--ghost" data-combo style="margin-top:10px">${icon('spark')} 추천 조합 보기</button>
      <button class="btn" data-bet style="margin-top:10px">${icon('coin')} 이 경주 배팅하러 가기</button>
    </div>`;
  }
  // 브레인+전문가 합성 조합 (복연승 3 · 삼복승 3)
  function showCombos(r) {
    const b6 = r.ranked.slice(0, 6).map(h => h.no), e6 = (r.expert || []).slice(0, 6);
    const score = {};
    b6.forEach((n, i) => score[n] = (score[n] || 0) + (6 - i));
    e6.forEach((n, i) => score[n] = (score[n] || 0) + (6 - i));
    const m = Object.keys(score).map(Number).sort((a, b) => score[b] - score[a]);
    const both = n => b6.includes(n) && e6.includes(n);
    const q = [[m[0],m[1]], [m[0],m[2]], [m[1],m[2]]].filter(p => p.every(x => x != null));
    const t = [[m[0],m[1],m[2]], [m[0],m[1],m[3]], [m[0],m[2],m[3]]].filter(p => p.every(x => x != null));
    const chips = arr => `<div class="reco-chips">${arr.map(n => `<span class="rchip ${both(n)?'hit':''}">${n}</span>`).join('')}</div>`;
    const body = `
      <div class="muted" style="font-size:12px;margin-bottom:10px;line-height:1.5">브레인+전문가 <b>공통 추천</b>은 <span class="rchip hit" style="width:16px;height:16px;font-size:10px;vertical-align:-3px">●</span>. 상위 합성 순위로 조합했어요.</div>
      <div class="combo-t">복연승식 · 2두</div>
      ${q.map((p,i)=>`<div class="combo-row"><span class="combo-n">${i+1}</span>${chips(p)}</div>`).join('')}
      <div class="combo-t" style="margin-top:14px">삼복승식 · 3두</div>
      ${t.map((p,i)=>`<div class="combo-row"><span class="combo-n">${i+1}</span>${chips(p)}</div>`).join('')}
      <div class="muted" style="font-size:11px;margin-top:12px;text-align:center">참고용 조합이에요 · 실제 배팅은 신중히!</div>`;
    modal(`${regShort(r.region)} ${r.raceNo}R 추천 조합`, body);
  }
  // ranked에 rank 부여
  DB.preRaces.forEach(r => r.ranked.forEach((h, i) => h.rank = i + 1));
  return shell({ title: '브레인 분석', sub: '경마지 사전 분석', tab: 'brain', body });
});

/* =========================================================

route('betting', () => {
  const d = State.draft;
  if (!d.bets.length) d.bets = [{ type: 'win', horses: [], amount: null }];
  let bi = 0;
  // 이 경주의 브레인/전문가 추천 (있으면 상단에 표시)
  const pr = DB.preRaces.find(r => r.region === d.region && r.raceNo === d.raceNo && r.date === d.date);
  const recoCard = pr ? `
    <div class="card card--glow" style="margin-bottom:16px;padding:12px 14px">
      <div class="reco-row"><span class="reco-src">🧠 브레인</span>
        <div class="reco-chips">${pr.ranked.slice(0,6).map((h,i)=>`<span class="rchip ${i===0?'hit':''}">${h.no}</span>`).join('')}</div></div>
      <div class="reco-row" style="margin-top:8px"><span class="reco-src">📰 전문가</span>
        <div class="reco-chips">${(pr.expert||[]).slice(0,6).map((no,i,arr)=>`<span class="rchip ${i===arr.length-1?'longshot':''}">${no}</span>`).join('') || '<span class="muted" style="font-size:12px">추천 없음</span>'}</div></div>
      <div class="muted" style="font-size:11px;margin-top:8px;line-height:1.5">🧠 첫 번째 <span class="rchip hit" style="width:15px;height:15px;font-size:9px;vertical-align:-2px">●</span> = 축(1순위) · 📰 마지막 <span class="rchip longshot" style="width:15px;height:15px;font-size:9px;vertical-align:-2px">●</span> = 고배당 복병</div>
    </div>` : '';
  const body = document.createElement('div');
  body.innerHTML = `
    <div class="steps"><div class="dot on"></div><div class="dot on"></div><span class="lbl">2 / 2 · 배팅</span></div>
    <div class="pony-line" style="margin-bottom:16px">${pony({ size: 56 })}
      <div class="speech"><b>${regShort(d.region)} ${d.raceNo}R</b> 배팅 정보를 골라주세요.<br>여러 개 걸 수 있어요! 마권 사진은 최대 10장.</div></div>
    ${recoCard}

    <div class="section-t">내 배팅 <span class="muted" id="betCount" style="font-weight:700"></span></div>
    <div class="bet-pager">
      <button class="pgbtn" id="prevBet">${icon('back')}</button>
      <div class="pg-ind" id="pgInd"></div>
      <button class="pgbtn" id="nextBet">${icon('arrow')}</button></div>
    <div id="betEditor"></div>
    <div class="bet-actions">
      <button class="btn btn--ghost btn--sm" id="addBet" style="flex:1">${icon('plus')} 배팅 추가</button>
      <button class="btn btn--ghost btn--sm" id="delBet" style="flex:1">${icon('trash')} 삭제</button></div>

    <div class="section-t">마권 사진 <span class="muted" id="slipCount" style="font-weight:700"></span></div>
    <div class="slip-grid" id="slipGrid"></div>
    <input type="file" id="slipFile" accept="image/*" multiple hidden>

    <div class="section-t">전체 요약</div>
    <div class="card" id="summary"></div>
    <div style="margin-top:16px"><button class="btn" id="confirmBet">${icon('check')} 배팅 확정</button></div>`;

  const editor = $('#betEditor', body), pgInd = $('#pgInd', body), betCount = $('#betCount', body),
        summary = $('#summary', body), slipGrid = $('#slipGrid', body), slipFile = $('#slipFile', body);
  const QUICK = [500, 1000, 1500, 2000];

  function renderPager() {
    betCount.textContent = `· 총 ${d.bets.length}건`;
    pgInd.textContent = `${bi + 1} / ${d.bets.length}`;
    $('#prevBet', body).disabled = bi === 0;
    $('#nextBet', body).disabled = bi === d.bets.length - 1;
    $('#delBet', body).disabled = d.bets.length <= 1;
  }
  function renderEditor() {
    const b = d.bets[bi], need = betNeed(b.type);
    editor.innerHTML = `<div class="bet-card">
      <div class="mini-t">배팅 타입</div>
      <div class="chip-wrap" id="typePick">${DB.betTypes.map(t=>`<button class="chip ${b.type===t.id?'active':''}" data-type="${t.id}">${t.name}</button>`).join('')}</div>
      <div class="mini-t" style="margin-top:14px">배팅 마번 <span class="muted" style="font-weight:600">· ${need}두 선택</span></div>
      <div class="num-grid" id="horsePick">${Array.from({length:12},(_,i)=>i+1).map(n=>`<button class="numchip ${b.horses.includes(n)?'active':''}" data-h="${n}">${n}</button>`).join('')}</div>
      <div class="mini-t" style="margin-top:14px">배팅 금액</div>
      <input class="inp" type="number" id="amount" inputmode="numeric" step="100" min="0" placeholder="금액 입력" value="${b.amount==null?'':b.amount}">
      <div class="numpad-input" id="quickAmt">${QUICK.map(a=>`<button class="chip" data-set="${a}">${a.toLocaleString()}</button>`).join('')}</div>
    </div>`;
    $('#typePick', editor).addEventListener('click', e => { const c = e.target.closest('[data-type]'); if (!c) return;
      b.type = c.dataset.type; b.horses = b.horses.slice(0, betNeed(b.type)); renderEditor(); renderSummary(); });
    $('#horsePick', editor).addEventListener('click', e => { const c = e.target.closest('[data-h]'); if (!c) return;
      const n = +c.dataset.h, need = betNeed(b.type);
      if (b.horses.includes(n)) b.horses = b.horses.filter(x => x !== n);
      else { if (b.horses.length >= need) b.horses.shift(); b.horses.push(n); }
      editor.querySelectorAll('#horsePick .numchip').forEach(x => x.classList.toggle('active', b.horses.includes(+x.dataset.h))); renderSummary(); });
    $('#amount', editor).oninput = e => { b.amount = e.target.value === '' ? null : (+e.target.value || 0); renderSummary(); };
    $('#quickAmt', editor).addEventListener('click', e => { const q = e.target.closest('[data-set]'); if (!q) return;
      b.amount = +q.dataset.set; $('#amount', editor).value = b.amount; renderSummary(); });
  }
  function renderSummary() {
    const total = d.bets.reduce((s, b) => s + (b.amount || 0), 0);
    summary.innerHTML = `<div class="kv"><span class="k">경주</span><span class="v">${regShort(d.region)} ${d.raceNo}R · ${d.mode==='real'?'실전':'모의'}</span></div>
      ${d.bets.map((b,i)=>`<div class="kv"><span class="k">${i+1}. ${typeName(b.type)}</span><span class="v">${b.horses.length?b.horses.map(n=>n+'번').join(','):'—'} · ${won(b.amount||0)}</span></div>`).join('')}
      <div class="kv total-row"><span class="k">합계 (${d.bets.length}건)</span><span class="v">${won(total)}</span></div>`;
  }
  function renderSlips() {
    $('#slipCount', body).textContent = `· ${d.slips.length}/10`;
    slipGrid.innerHTML = d.slips.map((nm,i)=>`<div class="slip"><div class="slip-ic">${icon('camera')}</div><span>${i+1}</span><button class="rm" data-rm="${i}">×</button></div>`).join('')
      + (d.slips.length < 10 ? `<button class="slip add" id="addSlip">${icon('plus')}<span>추가</span></button>` : '');
    const add = $('#addSlip', slipGrid); if (add) add.onclick = () => slipFile.click();
    slipGrid.querySelectorAll('[data-rm]').forEach(bb => bb.onclick = () => { d.slips.splice(+bb.dataset.rm, 1); renderSlips(); });
  }
  slipFile.onchange = () => { [...slipFile.files].forEach(f => { if (d.slips.length < 10) d.slips.push(f.name); }); slipFile.value=''; renderSlips(); };
  $('#prevBet', body).onclick = () => { if (bi>0){ bi--; renderPager(); renderEditor(); } };
  $('#nextBet', body).onclick = () => { if (bi<d.bets.length-1){ bi++; renderPager(); renderEditor(); } };
  $('#addBet', body).onclick = () => { d.bets.push({ type:'win', horses:[], amount:null }); bi=d.bets.length-1; renderPager(); renderEditor(); renderSummary(); };
  $('#delBet', body).onclick = () => { if (d.bets.length<=1) return; d.bets.splice(bi,1); if (bi>=d.bets.length) bi=d.bets.length-1; renderPager(); renderEditor(); renderSummary(); };
  $('#confirmBet', body).onclick = () => {
    for (let i=0;i<d.bets.length;i++){ const b=d.bets[i], need=betNeed(b.type);
      if (b.horses.length<need) return toast(`${i+1}번 배팅: ${need}두 선택해주세요`);
      if (!b.amount) return toast(`${i+1}번 배팅: 금액을 입력해주세요`); }
    const label = `${regShort(d.region)} ${d.raceNo}R`;
    d.recordId = State.addRecord({ date:d.date, mode:d.mode, region:d.region, raceNo:d.raceNo, label,
      bets:d.bets.map(b=>({type:b.type,horses:b.horses.slice(),amount:b.amount})), slips:d.slips.slice(), result:null, settled:false });
    go('done');
  };
  renderPager(); renderEditor(); renderSummary(); renderSlips();
  return shell({ title: '배팅하기', tab: 'setup', body, back: () => go('setup') });
});

  const body = document.createElement('div');
  body.innerHTML = `

    <div class="section-t">🏁 착순 입력 <span class="muted" style="font-weight:700">· 1·2·3착 마번</span></div>
    ${places.map(([k,l])=>`<div class="mini-t" style="margin:6px 2px 6px">${l}</div>
      <div class="num-grid" data-place="${k}">${Array.from({length:12},(_,i)=>i+1).map(n=>`<button class="numchip ${r[k]===n?'active':''}" data-h="${n}">${n}</button>`).join('')}</div>`).join('')}

    <div class="section-t">${icon('coin')} 배팅별 결과 <span class="muted" style="font-weight:700">· 적중 배팅에 배당률 입력</span></div>
    <div id="mults"></div>

    <div class="section-t">결과 사진 <span class="muted" style="font-weight:700">· 선택</span></div>
    <div class="drop" id="resDrop" style="padding:18px"><div class="ic">${icon('camera')}</div>
      <h4 style="font-size:14px">결과 사진 업로드</h4><p>배당률표를 찍어두면 편해요</p></div>
    <input type="file" id="resFile" accept="image/*" hidden><div id="resFileList"></div>

    <div style="margin-top:22px"><button class="btn" id="calc">${icon('check')} 결과 확인하기</button></div>`;

  const multsBox = $('#mults', body);
  function renderBets() {
    const done = r.first != null;
    multsBox.innerHTML = rec.bets.map((b, i) => {
      const hit = done && evalHit({ ...b, idx: i }, r);
      const no = b.horses.map(n => n + '번').join(', ');
      let inner;
      if (!done) inner = `<div class="mc-get muted">착순을 입력하면 적중 판정돼요</div>`;
      else if (hit) inner = `<div class="mc-in"><span class="mc-lbl">배당률</span>
          <input class="inp mult-inp" type="number" inputmode="decimal" step="0.1" min="0" placeholder="예) 4.2" data-mi="${i}" value="${r.mults[i]!=null?r.mults[i]:''}"><span class="mc-x">배</span></div>
        <div class="mc-get up" data-get="${i}"></div>`;
      else inner = `<div class="mc-get miss">✗ 미적중 (착순 불일치)</div>`;
      return `<div class="mult-card ${done?(hit?'is-hit':'is-miss'):''}">
        <div class="mc-top"><span class="mc-type">${i+1}. ${typeName(b.type)} ${done?(hit?'<span class="hbadge">적중</span>':''):''}</span><span class="mc-no">${no}</span></div>
        ${inner}</div>`;
    }).join('');
    multsBox.querySelectorAll('[data-mi]').forEach(inp => {
      inp.oninput = e => { r.mults[inp.dataset.mi] = e.target.value === '' ? null : +e.target.value; refreshGet(+inp.dataset.mi); };
      refreshGet(+inp.dataset.mi);
    });
  }
  function refreshGet(i) {
    const b = rec.bets[i], m = +r.mults[i] || 0, box = $(`[data-get="${i}"]`, body);
    if (box) box.textContent = m > 0 ? `획득 ${won((b.amount||0)*m)}` : '배당률을 입력하세요';
  }
  body.querySelectorAll('[data-place]').forEach(row => row.addEventListener('click', e => {
    const c = e.target.closest('[data-h]'); if (!c) return;
    const k = row.dataset.place;
    r[k] = (r[k] === +c.dataset.h) ? null : +c.dataset.h;   // 다시 누르면 해제
    row.querySelectorAll('.numchip').forEach(x => x.classList.toggle('active', +x.dataset.h === r[k]));
    renderBets();
  }));
  renderBets();
  const resDrop=$('#resDrop',body), resFile=$('#resFile',body), resFileList=$('#resFileList',body);
  resDrop.onclick=()=>resFile.click();
  resFile.onchange=()=>{ const f=resFile.files[0]; if(!f)return; r.photo=f.name;
    resFileList.innerHTML=`<div class="filerow"><div class="ic">${icon('camera')}</div><div><div class="nm">${esc(f.name)}</div></div><button class="x" id="rmRes">×</button></div>`;
    $('#rmRes',resFileList).onclick=()=>{resFileList.innerHTML='';r.photo=null;}; };
  $('#calc', body).onclick = () => {
    if (r.first == null) return toast('최소 1착은 입력해주세요 🐴');
    State.updateRecord(rec.id, { result: r, settled: true });
    go('resultDone', { q: 'id=' + rec.id });
  };
  return shell({ title: '결과 입력', tab: 'setup', body, back: () => go('done') });
});

/* =========================================================
   결과분석 (내 실제 기록)

let resMode = 'real', resOpen = null, resView = 'bets', resRecoDate = null, resBetsDate = null;
route('results', () => {
  const body = document.createElement('div');
  body.innerHTML = `
    <div class="seg seg--pill" id="viewSeg" style="margin-bottom:14px">
      <button data-v="bets" class="${resView==='bets'?'active':''}">🎫 내 배팅 성적</button>
      <button data-v="reco" class="${resView==='reco'?'active':''}">🎯 추천 적중률</button></div>
    <div class="tabs" id="modeTabs" style="${resView==='reco'?'display:none':''}">
      <button class="tab ${resMode==='real'?'active':''}" data-m="real">실전</button>
      <button class="tab ${resMode==='mock'?'active':''}" data-m="mock">모의</button></div>
    <div id="resBody"></div>`;
  const rb = $('#resBody', body);
  $('#viewSeg', body).addEventListener('click', e => { const v = e.target.closest('[data-v]'); if (!v) return;
    resView = v.dataset.v;
    body.querySelectorAll('#viewSeg button').forEach(x => x.classList.toggle('active', x === v));
    $('#modeTabs', body).style.display = resView === 'reco' ? 'none' : '';
    resView === 'reco' ? renderReco() : render2();
  });
  function render2() {
    const s = recStats(resMode), oh = overallHit(s.byType), dates = recDates(resMode);
    let html = '';
    if (!State.records.filter(r=>r.mode===resMode).length) {
      html = `<div class="card" style="text-align:center;padding:30px 18px;color:var(--muted);line-height:1.6">아직 ${resMode==='real'?'실전':'모의'} 기록이 없어요.<br>레이스에서 배팅하면 여기 쌓여요! 🐎</div>`;
      rb.innerHTML = html; return;
    }
    html += `<div class="hero" style="margin-bottom:6px"><div class="glowline"></div>
      <div class="cnt" style="margin-bottom:10px"><b>${s.sessions}</b><span class="u">회</span><span class="dot">·</span><b>${s.races}</b><span class="u">경주</span></div>
      <div class="stat-grid">
        <div class="stat"><div class="k">배팅금액</div><div class="v">${won(s.bet)}</div></div>
        <div class="stat"><div class="k">배당금액</div><div class="v">${won(s.payout)}</div><div class="delta ${net(s)>=0?'up':'down'}">${net(s)>=0?'▲':'▼'} ${won(Math.abs(net(s)))}</div></div>
        <div class="stat big"><div class="row between"><div class="k">회수율</div><div class="v" style="font-size:18px">${roi(s)}<small>%</small></div></div></div>
        <div class="stat big"><div class="row between"><div class="k">적중률</div><div class="v" style="font-size:18px">${oh.rate}<small>% (${oh.hits}/${oh.entries})</small></div></div></div>
      </div></div>`;
    // 날짜(회차) 셀렉트 — 최신 먼저, 클릭해서 하루씩 보기
    if (!resBetsDate || !dates.some(d => d.date === resBetsDate)) resBetsDate = dates[0].date;
    html += `<div class="date-row" id="betsDates">${dates.map(({date, recs}) =>
      `<button class="date-chip ${date===resBetsDate?'active':''}" data-bd="${date}">${fmtMD(date)} <span class="muted" style="font-weight:600">${recs.length}경주</span></button>`).join('')}</div>`;
    const sel = dates.find(d => d.date === resBetsDate) || dates[0];
    { const {date, recs} = sel;
      // 회차(날짜)별 소계
      let db = 0, dp = 0, settledN = 0;
      recs.forEach(rec => { const su = recSummary(rec); db += su.bet; if (rec.settled) { dp += su.payout; settledN++; } });
      const droi = db ? Math.round(dp / db * 100) : 0, dnet = dp - db;
      html += `<div class="section-t">${date} · ${recs.length}경주</div>
        <div class="daysum"><div><span class="muted">배팅 ${won(db)} → 배당 ${won(dp)}</span></div>
          ${settledN ? `<div class="row gap8"><span class="roi-pill ${droi>=100?'up':'down'}" style="font-size:12px;padding:3px 9px">${droi}%</span><span class="${dnet>=0?'up':'down'}" style="font-weight:800;font-size:13px">${dnet>=0?'+':'-'}${won(Math.abs(dnet))}</span></div>` : `<span class="muted" style="font-size:12px">결과 대기</span>`}</div>`;
      recs.forEach(rec => {
        const su = recSummary(rec), open = resOpen === rec.id;
        const pill = rec.settled ? `<span class="roi-pill ${su.roi>=100?'up':'down'}">${su.roi}%</span>`
          : `<span class="roi-pill pend" data-enter="${rec.id}">결과입력</span>`;
        html += `<div class="race-item ${open?'open':''}">
          <div class="race-headrow">
            <button class="race-head" data-open="${rec.id}" style="flex:1">
              <div><div class="race-name">${esc(rec.label)} <span class="badge ${rec.mode==='mock'?'badge--mock':''}">${rec.mode==='real'?'실전':'모의'}</span></div>
                <div class="muted" style="font-size:12px;margin-top:3px">배팅 ${won(su.bet)} · ${rec.bets.length}건${rec.settled?'':' · 결과 대기'}</div></div>
              ${pill}</button>
            <button class="del-race" data-del="${rec.id}" aria-label="경기 삭제">${icon('trash')}</button>
          </div>
          ${open ? raceDetail(rec, su) : ''}</div>`;
      });
    }
    rb.innerHTML = html;
    rb.querySelectorAll('[data-bd]').forEach(b => b.onclick = () => { resBetsDate = b.dataset.bd; resOpen = null; render2(); });
    rb.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { resOpen = resOpen===b.dataset.open?null:b.dataset.open; render2(); });
    rb.querySelectorAll('[data-enter]').forEach(b => b.onclick = (e) => { e.stopPropagation(); go('result', { q:'id='+b.dataset.enter }); });
    rb.querySelectorAll('[data-del]').forEach(b => b.onclick = (e) => { e.stopPropagation();
      const rec = State.getRecord(b.dataset.del);
      if (confirm(`「${rec ? rec.label : '이 경기'}」 기록을 정말 삭제하시겠습니까?`)) {
        State.deleteRecord(b.dataset.del); resOpen = null; toast('삭제했어요'); render2();
      }});
  }
  function raceDetail(rec, su) {
    const rr = rec.result;
    return `<div class="race-detail">
      ${rec.settled?`<div class="muted" style="font-size:12px;margin-bottom:8px">착순 ${rr.first??'-'}·${rr.second??'-'}·${rr.third??'-'}</div>`:''}
      <div class="btable">
        <div class="btr bthead"><span>배팅방식</span><span>마번</span><span>배팅액</span><span>결과</span><span>획득</span></div>
        ${rec.bets.map((b,i)=>{ const e=rec.settled?evalBet({...b,idx:i},rr):{hit:false,get:0,mult:0};
          return `<div class="btr ${e.hit?'hit':''}"><span>${typeName(b.type)}</span><span>${b.horses.map(n=>n+'번').join(',')}</span><span>${won(b.amount)}</span>
            <span class="${e.hit?'up':'muted'}">${!rec.settled?'대기':(e.hit?`적중 ${e.mult||'-'}배`:'미적중')}</span>
            <span class="${e.hit?'up':'muted'}" style="font-weight:800">${e.hit?'+'+won(e.get):(rec.settled?'-':'')}</span></div>`; }).join('')}
      </div>
      ${rec.settled?`<div class="race-sum"><span>회수율 ${su.roi}%</span><span class="${su.net>=0?'up':'down'}">순손익 ${su.net>=0?'+':'-'}${won(Math.abs(su.net))}</span></div>`
        :`<button class="btn btn--sm" style="width:100%;margin-top:10px" data-enter2="${rec.id}">${icon('medal')} 결과 입력하기</button>`}
    </div>`;
  }
  // ===== 추천 적중률 뷰 =====
  function recoRaces() {
    const seen = {}, out = [];
    State.records.filter(r => r.settled && r.result && r.result.first != null).forEach(rec => {
      const key = rec.region + '|' + rec.raceNo + '|' + rec.date;
      if (seen[key]) return;
      const pr = DB.preRaces.find(p => p.region === rec.region && p.raceNo === rec.raceNo && p.date === rec.date);
      if (!pr) return;
      seen[key] = 1; out.push({ rec, pr });
    });
    return out;
  }
  function renderReco() {
    const all = recoRaces();
    if (!all.length) {
      rb.innerHTML = `<div class="card" style="text-align:center;padding:30px 18px;color:var(--muted);line-height:1.7">
        아직 데이터가 없어요.<br><b style="color:var(--text-2)">브레인 분석이 있는 경주</b>에 배팅하고<br>결과(착순)를 입력하면 여기 쌓여요! 📈<br>
        <span style="font-size:12px">브레인 vs 전문가, 누가 더 잘 맞히는지 비교해봐요.</span></div>`;
      return;
    }
    // 날짜별 그룹 (데이터 있는 날만, 최신 먼저)
    const byDate = {};
    all.forEach(o => { (byDate[o.rec.date] = byDate[o.rec.date] || []).push(o); });
    const dates = Object.keys(byDate).sort((a, b) => a < b ? 1 : -1);
    if (!resRecoDate || !byDate[resRecoDate]) resRecoDate = dates[0];
    const races = byDate[resRecoDate];

    const top3of = rec => [rec.result.first, rec.result.second, rec.result.third].filter(x => x != null);
    const pickHit = (recs, top3) => recs.some(n => top3.includes(n));
    // 점수제: 라운드마다 실제 1·2·3착 중 몇 개를 추천에 담았나 → 3개100·2개60·1개30·0개0점, 날짜 평균
    const scoreOf = k => k >= 3 ? 100 : k >= 2 ? 60 : k >= 1 ? 30 : 0;
    const cntIn = (recs, t3) => recs.reduce((c, n) => c + (t3.includes(n) ? 1 : 0), 0);
    let bPs = 0, bWs = 0, ePs = 0, eWs = 0;
    races.forEach(({ rec, pr }) => {
      const t3 = top3of(rec);
      const b6 = pr.ranked.slice(0, 6).map(h => h.no), e6 = (pr.expert || []).slice(0, 6);
      bPs += scoreOf(cntIn(b6, t3)); bWs += scoreOf(cntIn(b6.slice(0, 3), t3));
      ePs += scoreOf(cntIn(e6, t3)); eWs += scoreOf(cntIn(e6.slice(0, 3), t3));
    });
    const N = races.length, avg = s => Math.round(s / N);
    const dateChips = `<div class="date-row" id="recoDates">${dates.map(d => {
      const mock = byDate[d][0].rec.mode === 'mock';
      return `<button class="date-chip ${d===resRecoDate?'active':''}" data-rd="${d}">${fmtMD(d)} <span class="muted" style="font-weight:600">${mock?'모의':'실전'}</span></button>`;
    }).join('')}</div>`;
    const accCard = (icn, title, pickS, winS) => `<div class="acc-card">
      <div class="acc-h">${icn} <b>${title}</b></div>
      <div class="acc-grid">
        <div><div class="acc-k">win 점수 <span class="muted">(상위3)</span></div><div class="acc-v">${avg(winS)}<small>점</small></div></div>
        <div><div class="acc-k">pick 점수 <span class="muted">(상위6)</span></div><div class="acc-v">${avg(pickS)}<small>점</small></div></div>
      </div></div>`;
    const chips = (recs, t3, n) => recs.slice(0, n).map(no => `<span class="rchip ${t3.includes(no) ? 'hit' : ''}">${no}</span>`).join('');
    const badge = ok => `<span class="rbadge ${ok ? 'ok' : 'no'}">${ok ? '적중' : '미적중'}</span>`;
    const scoreTag = (recs, t3) => { const k = cntIn(recs, t3); return `<b>${scoreOf(k)}점</b> <span class="muted">(${k}/3)</span>`; };
    rb.innerHTML = `
      ${dateChips}
      <div class="muted" style="font-size:12px;margin:0 2px 10px;line-height:1.5">${resRecoDate} · 결과 입력한 <b>${N}경주</b> 평균 · 라운드마다 실제 1·2·3착 중 <b>3개=100 · 2개=60 · 1개=30 · 0개=0점</b> → <b style="color:var(--amber)">win 점수</b>가 100에 가까울수록 정확!</div>
      ${accCard('🧠', '브레인', bPs, bWs)}
      ${accCard('📰', '전문가', ePs, eWs)}
      <div class="section-t">경주별 상세</div>
      ${races.map(({ rec, pr }) => {
        const t3 = top3of(rec), b6 = pr.ranked.slice(0, 6).map(h => h.no), e6 = (pr.expert || []).slice(0, 6);
        return `<div class="card" style="margin-bottom:10px">
          <div class="row between" style="margin-bottom:8px"><b>${esc(rec.label)}</b><span class="muted" style="font-size:12px">착순 ${t3.join('·')}</span></div>
          <div class="reco-row"><span class="reco-src">🧠 브레인</span><div class="reco-chips">${chips(b6, t3, 6)}</div></div>
          <div class="reco-tags">win ${scoreTag(b6.slice(0,3), t3)} · pick ${scoreTag(b6, t3)}</div>
          <div class="reco-row" style="margin-top:8px"><span class="reco-src">📰 전문가</span><div class="reco-chips">${chips(e6, t3, 6)}</div></div>
          <div class="reco-tags">win ${scoreTag(e6.slice(0,3), t3)} · pick ${scoreTag(e6, t3)}</div>
        </div>`;
      }).join('')}`;
    rb.querySelectorAll('[data-rd]').forEach(b => b.onclick = () => { resRecoDate = b.dataset.rd; renderReco(); });
  }

  $('#modeTabs', body).addEventListener('click', e => { const m=e.target.closest('[data-m]'); if(!m)return; resMode=m.dataset.m; resOpen=null;
    body.querySelectorAll('#modeTabs .tab').forEach(x=>x.classList.toggle('active',x===m)); render2(); });
  rb.addEventListener('click', e => { const b=e.target.closest('[data-enter2]'); if(b) go('result',{q:'id='+b.dataset.enter2}); });
  resView === 'reco' ? renderReco() : render2();
  return shell({ title: '결과분석', sub: '내 배팅 성적 · 추천 적중률', tab: 'results', body });
});

route('profile', () => {
  const body = document.createElement('div');
  const name = State.user.name || '경마러';
  const rs = recStats('real'), ms = recStats('mock');
  body.innerHTML = `
    <div class="pony-line" style="margin:6px 0 18px">${pony({ size: 70 })}<div class="speech">안녕하세요 <b>${esc(name)}</b>님!</div></div>
    <div class="card"><div class="field" style="margin-bottom:14px"><label>이름</label>
      <input class="inp" id="pfName" value="${esc(name)}" maxlength="12"></div>
      <button class="btn btn--ghost" id="saveName">이름 저장</button></div>
    <div class="section-t">기록</div>
    <div class="card">
      <div class="kv"><span class="k">실전</span><span class="v">${rs.sessions}회 · ${rs.races}경주 · 회수율 ${roi(rs)}%</span></div>
      <div class="kv"><span class="k">모의</span><span class="v">${ms.sessions}회 · ${ms.races}경주 · 회수율 ${roi(ms)}%</span></div>
      <div class="kv"><span class="k">저장된 기록</span><span class="v">${State.records.length}건</span></div>
    </div>
    <div class="section-t">데이터 백업 <span class="muted" style="font-weight:700">· 기기가 바뀌거나 브라우저를 지워도 안전하게</span></div>
    <div class="card">
      <div class="muted" style="font-size:12.5px;line-height:1.6;margin-bottom:12px">📥 <b>내보내기</b>로 기록을 파일로 저장해두면, 나중에 <b>불러오기</b>로 되살릴 수 있어요. (브라우저 삭제·기기 변경 대비)</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <button class="btn btn--ghost" id="expJson">${icon('pdf')} 백업 내보내기 (${State.records.length}건)</button>
        <button class="btn btn--ghost" id="impJson">${icon('plus')} 백업 불러오기</button>
        <input type="file" id="impFile" accept="application/json,.json" hidden></div>
    </div>
    <div class="section-t">회차별 초기화 <span class="muted" style="font-weight:700">· 날짜(회차) 선택 삭제</span></div>
    <div id="wipeDates"></div>
    <div style="margin-top:18px;display:flex;flex-direction:column;gap:10px">
      <button class="btn btn--ghost" id="resetOnb">온보딩 다시 보기</button>
      <button class="btn btn--ghost" id="wipe" style="color:var(--down)">＋ 모든 기록 초기화</button></div>`;
  // 회차(날짜)별 목록 + 삭제
  const wd = $('#wipeDates', body);
  function renderWipe() {
    const map = {};
    State.records.forEach(r => { map[r.date] = map[r.date] || { real: 0, mock: 0 }; map[r.date][r.mode]++; });
    const dates = Object.keys(map).sort((a, b) => a < b ? 1 : -1);
    if (!dates.length) { wd.innerHTML = `<div class="card" style="text-align:center;padding:18px;color:var(--muted);font-size:13px">삭제할 회차가 없어요.</div>`; return; }
    wd.innerHTML = `<div class="card" style="padding:6px 14px">${dates.map(d => {
      const m = map[d], parts = [m.real ? `실전 ${m.real}` : '', m.mock ? `모의 ${m.mock}` : ''].filter(Boolean).join(' · ');
      return `<div class="kv"><span class="k">${d} <span class="muted" style="font-weight:600">· ${parts}경주</span></span>
        <button class="wipebtn" data-wd="${d}">${icon('trash')} 삭제</button></div>`;
    }).join('')}</div>`;
    wd.querySelectorAll('[data-wd]').forEach(b => b.onclick = () => {
      if (confirm(`${b.dataset.wd} 회차 기록을 지울까요?`)) { State.deleteByDate(b.dataset.wd); toast('해당 회차를 삭제했어요'); render(); }
    });
  }
  renderWipe();
  // 백업 내보내기 / 불러오기
  $('#expJson', body).onclick = () => {
    if (!State.records.length) return toast('내보낼 기록이 없어요');
    const blob = new Blob([State.exportJSON()], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `racebrain-backup-${todayISO()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast(`백업 파일 저장 (${State.records.length}건) 📥`);
  };
  const impFile = $('#impFile', body);
  $('#impJson', body).onclick = () => impFile.click();
  impFile.onchange = () => {
    const f = impFile.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      const res = State.importJSON(String(reader.result));
      if (!res.ok) return toast(res.msg);
      toast(res.added ? `${res.added}건 복원 완료! (총 ${res.total}건) 🎉` : '이미 다 있는 기록이에요');
      render();
    };
    reader.onerror = () => toast('파일을 읽지 못했어요');
    reader.readAsText(f); impFile.value = '';
  };
  $('#saveName', body).onclick = () => { State.saveName($('#pfName', body).value || '경마러'); toast('저장했어요 🐴'); };
  $('#resetOnb', body).onclick = () => { store.del('rb.name'); State.user.name=''; go('onboarding'); };
  $('#wipe', body).onclick = () => { if (confirm('저장된 배팅 기록을 모두 지울까요?')) { State.records=[]; State._saveRecords(); toast('기록을 초기화했어요'); render(); } };
  return shell({ title: '내 정보', tab: 'profile', body });
});

/* ---------- 부팅 ---------- */
render();

</script>
</body>
</html>
